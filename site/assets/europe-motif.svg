      <stop offset="0%" stop-color="#0052cc" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#0052cc" stop-opacity="0"></stop>
    </radialGradient>
    <pattern id="eu-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
