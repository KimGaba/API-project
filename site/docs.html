<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Company Data API · Docs</title>
  <link rel="stylesheet" href="./assets/colors_and_type.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; background: white; } * { box-sizing: border-box; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="./assets/components.jsx" data-presets="react"></script>
  <script type="text/babel" data-presets="react">
    function CodeBlock({ label, code }) {
      return (
        <div className="rounded-2xl overflow-hidden" style={{ background: "var(--brand-950)", border: "1px solid #1f2933" }}>
          <div className="flex items-center gap-3 px-4 py-3 border-b" style={{ background: "#1a222c", borderColor: "#1f2933" }}>
            <span className="w-2.5 h-2.5 rounded-full" style={{ background: "rgba(239,68,68,0.7)" }}/>
            <span className="w-2.5 h-2.5 rounded-full" style={{ background: "rgba(234,179,8,0.7)" }}/>
            <span className="w-2.5 h-2.5 rounded-full" style={{ background: "rgba(34,197,94,0.7)" }}/>
            <span className="ml-2 text-[12px] font-medium" style={{ color: "var(--brand-400)", fontFamily: "var(--font-mono)" }}>{label}</span>
          </div>
          <pre className="p-5 text-[13px] leading-[1.7] overflow-x-auto m-0" style={{ color: "var(--code-fg)", fontFamily: "var(--font-mono)" }}>{code}</pre>
        </div>
      );
    }

    function Endpoint({ method, path, auth, desc, params, response }) {
      return (
        <div className="rounded-2xl border overflow-hidden" style={{ borderColor: "var(--brand-100)" }}>
          <div className="px-6 py-5 border-b" style={{ borderColor: "var(--brand-100)", background: "var(--brand-50)" }}>
            <div className="flex flex-wrap items-center gap-3 mb-3">
              <span className="px-3 py-1 rounded-full text-[12px] font-bold"
                    style={{ background: "rgba(16,185,129,0.1)", color: "#059669" }}>{method}</span>
              <code className="text-[14px] font-medium" style={{ color: "var(--brand-900)", fontFamily: "var(--font-mono)" }}>{path}</code>
              {auth && (
                <span className="px-2.5 py-1 rounded-full text-[11px] font-semibold uppercase tracking-wider"
                      style={{ background: "var(--accent-soft)", color: "var(--accent)" }}>{auth}</span>
              )}
            </div>
            <p className="text-[14px] m-0" style={{ color: "var(--brand-500)" }}>{desc}</p>
          </div>
          <div className="grid md:grid-cols-2 divide-y md:divide-y-0 md:divide-x" style={{ divideColor: "var(--brand-100)" }}>
            <div className="p-6">
              {params && (
                <table className="w-full text-[13px]" style={{ borderCollapse: "collapse" }}>
                  <thead>
                    <tr>
                      {["Parameter", "Type", "Notes"].map(h => (
                        <th key={h} className="pb-2 text-left text-[11px] font-bold uppercase tracking-wider"
                            style={{ color: "var(--brand-400)", borderBottom: "1px solid var(--brand-100)", paddingRight: 16 }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {params.map(([name, type, note]) => (
                      <tr key={name}>
                        <td className="py-2 pr-4" style={{ borderBottom: "1px solid var(--brand-50)" }}>
                          <code style={{ color: "var(--accent)", fontFamily: "var(--font-mono)", fontSize: 13 }}>{name}</code>
                        </td>
                        <td className="py-2 pr-4" style={{ color: "var(--brand-400)", borderBottom: "1px solid var(--brand-50)" }}>{type}</td>
                        <td className="py-2" style={{ color: "var(--brand-600)", borderBottom: "1px solid var(--brand-50)" }}>{note}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
            <div className="p-6">
              <CodeBlock label="Response" code={response}/>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <>
          <TopNav active="docs"/>

          {/* Hero */}
          <section className="pt-16 pb-20" style={{ background: "var(--bg-hero)" }}>
            <div className="max-w-7xl mx-auto px-6">
              <span className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[11px] font-bold uppercase tracking-wider mb-7"
                    style={{ background: "var(--accent-soft)", color: "var(--accent-strong)", border: "1px solid var(--accent-ring)", fontFamily: "var(--font-display)" }}>
                Documentation
              </span>
              <h1 className="font-bold leading-[1.07] max-w-xl"
                  style={{ fontFamily: "var(--font-display)", fontSize: "clamp(36px,5vw,56px)", letterSpacing: "-0.025em", color: "var(--brand-900)" }}>
                A small contract. Quick to integrate.
              </h1>
              <p className="mt-5 text-[17px] leading-[1.6] max-w-lg" style={{ color: "var(--brand-500)" }}>
                Base URL, one auth header, three endpoints.
                Most integrations are up and running in under an hour.
              </p>
              <div className="mt-8 flex flex-wrap gap-3">
                <PrimaryButton href="./demo.html">Try it live</PrimaryButton>
                <GhostButton href="./coverage.html">Supported countries</GhostButton>
              </div>
            </div>
          </section>

          {/* Quick start */}
          <section className="py-20" style={{ background: "var(--brand-50)" }}>
            <div className="max-w-7xl mx-auto px-6">
              <div className="mb-10">
                <h2 className="text-[26px] font-bold" style={{ fontFamily: "var(--font-display)", letterSpacing: "-0.02em", color: "var(--brand-900)" }}>Quick start</h2>
              </div>
              <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                {[
                  { n: "1", title: "Set the base URL", desc: <><code style={{ fontFamily: "var(--font-mono)", background: "white", padding: "2px 6px", borderRadius: 4, fontSize: 12 }}>http://192.168.1.10:3011</code></> },
                  { n: "2", title: "Add your API key", desc: <><code style={{ fontFamily: "var(--font-mono)", background: "white", padding: "2px 6px", borderRadius: 4, fontSize: 12 }}>x-api-key: demo_live_123</code></> },
                  { n: "3", title: "Start with countries", desc: "List available countries, then query companies." },
                  { n: "4", title: "Run it in the demo", desc: "The browser playground uses the exact same routes." },
                ].map(s => (
                  <div key={s.n} className="p-5 bg-white rounded-2xl border" style={{ borderColor: "var(--brand-100)", boxShadow: "var(--shadow-sm)" }}>
                    <div className="w-7 h-7 rounded-full grid place-items-center text-[12px] font-bold text-white mb-3 flex-shrink-0"
                         style={{ background: "var(--accent)" }}>{s.n}</div>
                    <div className="font-semibold text-[14px] mb-1" style={{ color: "var(--brand-900)", fontFamily: "var(--font-display)" }}>{s.title}</div>
                    <div className="text-[13px]" style={{ color: "var(--brand-500)" }}>{s.desc}</div>
                  </div>
                ))}
              </div>
              <div className="grid md:grid-cols-2 gap-5">
                <CodeBlock label="cURL" code={`curl "http://192.168.1.10:3011/v1/companies/search?q=Equinor&country=NO&limit=5" \\
  -H "x-api-key: demo_live_123"`}/>
                <CodeBlock label="JavaScript" code={`const res = await fetch(
  "http://192.168.1.10:3011/v1/companies/search?q=Equinor&country=NO",
  { headers: { "x-api-key": "demo_live_123" } }
);
const data = await res.json();`}/>
              </div>
            </div>
          </section>

          {/* Endpoints */}
          <section className="py-20" style={{ background: "white" }}>
            <div className="max-w-7xl mx-auto px-6 space-y-8">
              <div className="mb-10">
                <span className="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider mb-3"
                      style={{ color: "var(--accent-strong)", fontFamily: "var(--font-display)" }}>Endpoints</span>
                <h2 className="text-[26px] font-bold" style={{ fontFamily: "var(--font-display)", letterSpacing: "-0.02em", color: "var(--brand-900)" }}>API reference</h2>
              </div>

              <Endpoint
                method="GET" path="/health" auth={null}
                desc="Unauthenticated heartbeat for monitoring and smoke tests."
                params={[
                  ["(none)", "—", "No parameters required."]
                ]}
                response={`{\n  "status": "ok",\n  "service": "company-data-api",\n  "timestamp": "2026-05-19T12:00:00.000Z"\n}`}
              />

              <Endpoint
                method="GET" path="/v1/meta/countries" auth="x-api-key required"
                desc="Returns the current country catalogue — which markets are live and their source status."
                params={[
                  ["(none)", "—", "No parameters required."]
                ]}
                response={`{\n  "data": [\n    { "code": "NO", "name": "Norway",\n      "enabled": true, "sourceStatus": "active" },\n    { "code": "GB", "name": "United Kingdom",\n      "enabled": true, "sourceStatus": "active" }\n  ],\n  "meta": { "total": 3 }\n}`}
              />

              <Endpoint
                method="GET" path="/v1/companies/search" auth="x-api-key required"
                desc="Search companies by name or registration number, with optional country filtering."
                params={[
                  ["q", "string", "Optional. 1–120 chars. Company name or reg. number."],
                  ["country", "string", "Optional. ISO code: NO, FI, GB."],
                  ["limit", "number", "Optional. 1–50, default 10."],
                ]}
                response={`{\n  "data": [\n    {\n      "countryCode": "NO",\n      "registrationNumber": "986187009",\n      "name": "EQUINOR ASA",\n      "status": "active"\n    }\n  ],\n  "meta": {\n    "query": "Equinor",\n    "country": "NO",\n    "limit": 10,\n    "total": 1\n  }\n}`}
              />
            </div>
          </section>

          {/* Errors */}
          <section className="py-20" style={{ background: "var(--brand-50)" }}>
            <div className="max-w-7xl mx-auto px-6">
              <div className="mb-10">
                <span className="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider mb-3"
                      style={{ color: "var(--accent-strong)", fontFamily: "var(--font-display)" }}>Errors</span>
                <h2 className="text-[26px] font-bold" style={{ fontFamily: "var(--font-display)", letterSpacing: "-0.02em", color: "var(--brand-900)" }}>Error responses</h2>
              </div>
              <div className="grid md:grid-cols-2 gap-5">
                {[
                  { code: "401", title: "Unauthorized", desc: 'Missing or invalid x-api-key header.', body: `{\n  "error": "UNAUTHORIZED",\n  "message": "Missing or invalid API key."\n}` },
                  { code: "400", title: "Bad Request", desc: "Query parameters fail validation — e.g. limit out of range.", body: `{\n  "error": "BAD_REQUEST",\n  "message": "Invalid search query"\n}` },
                ].map(e => (
                  <div key={e.code} className="p-6 bg-white rounded-2xl border" style={{ borderColor: "var(--brand-100)", boxShadow: "var(--shadow-sm)" }}>
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-[13px] font-bold" style={{ fontFamily: "var(--font-mono)", color: "var(--danger)" }}>{e.code}</span>
                      <span className="font-semibold text-[15px]" style={{ color: "var(--brand-900)", fontFamily: "var(--font-display)" }}>{e.title}</span>
                    </div>
                    <p className="text-[14px] mb-4" style={{ color: "var(--brand-500)" }}>{e.desc}</p>
                    <CodeBlock label="Response" code={e.body}/>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <Footer/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
