<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Company Data API · Product</title>
  <link rel="stylesheet" href="./assets/colors_and_type.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; background: white; } * { box-sizing: border-box; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="./assets/components.jsx" data-presets="react"></script>
  <script type="text/babel" data-presets="react">
    const useCases = [
      { title: "KYC and compliance", desc: "Verify company registration numbers, legal names, and status before onboarding a business customer or partner." },
      { title: "CRM enrichment", desc: "Automatically fill in company details — address, industry, registration number — from a company name search." },
      { title: "B2B lead data", desc: "Look up companies by name to get verified registry information for sales and marketing workflows." },
    ];

    const capabilities = [
      { title: "Company search", desc: "Search by name or registration number. Filter by country. Get structured results with registration number, name, status, and address." },
      { title: "Country catalogue", desc: "Query which countries are active and what source status they carry. Use it to drive country pickers in your UI." },
      { title: "Registration lookup", desc: "Resolve a registration number to a verified company record — useful for validation and enrichment flows." },
      { title: "Predictable contract", desc: "Consistent field names, standard error codes (401, 400, 404), and versioned routes under /v1." },
      { title: "Norway — live", desc: "Brønnøysundregistrene. Company name, org number, address, industry code, and activity status. 1.16M companies." },
      { title: "Finland — live", desc: "PRH/YTJ open data. Company name, business ID, address, legal form, and status. 818K companies." },
    ];

    function Card({ title, desc }) {
      return (
        <article className="p-7 bg-white rounded-2xl border transition-all"
                 style={{ borderColor: "var(--brand-100)", boxShadow: "var(--shadow-sm)" }}
                 onMouseEnter={e => e.currentTarget.style.boxShadow = "var(--shadow-md)"}
                 onMouseLeave={e => e.currentTarget.style.boxShadow = "var(--shadow-sm)"}>
          <h3 className="text-[16px] font-semibold mb-2"
              style={{ fontFamily: "var(--font-display)", color: "var(--brand-900)" }}>{title}</h3>
          <p className="text-[14px] leading-relaxed" style={{ color: "var(--brand-500)" }}>{desc}</p>
        </article>
      );
    }

    function App() {
      return (
        <>
          <TopNav active="product"/>

          {/* Hero */}
          <section className="pt-16 pb-24 relative overflow-hidden" style={{ background: "var(--bg-hero)" }}>
            <img src="./assets/europe-motif.svg" alt=""
                 className="absolute right-[-60px] top-[20px] w-[500px] opacity-[0.25] pointer-events-none select-none hidden lg:block"/>
            <div className="max-w-7xl mx-auto px-6 relative z-10">
              <span className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[11px] font-bold uppercase tracking-wider mb-7"
                    style={{ background: "var(--accent-soft)", color: "var(--accent-strong)", border: "1px solid var(--accent-ring)", fontFamily: "var(--font-display)" }}>
                Product
              </span>
              <h1 className="font-bold leading-[1.07] max-w-2xl"
                  style={{ fontFamily: "var(--font-display)", fontSize: "clamp(36px,5vw,58px)", letterSpacing: "-0.025em", color: "var(--brand-900)" }}>
                Search and verify European company data.
              </h1>
              <p className="mt-5 text-[17px] leading-[1.6] max-w-xl" style={{ color: "var(--brand-500)" }}>
                One API, one auth header, predictable JSON responses — connected to official
                national registries in Norway, Finland, and the United Kingdom.
              </p>
              <div className="mt-8 flex flex-wrap gap-3">
                <PrimaryButton href="./demo.html">See it live</PrimaryButton>
                <GhostButton href="./coverage.html">Check coverage</GhostButton>
              </div>

              <div className="mt-14 grid sm:grid-cols-2 gap-5 max-w-2xl">
                {[
                  { title: "Official registry sources", desc: "Data from Brønnøysund (NO), PRH/YTJ (FI), and Companies House (UK) — not scraped, not aggregated from unknown sources." },
                  { title: "Built for integration", desc: "REST API with consistent field naming, standard HTTP status codes, and response shapes that don't change without notice." },
                ].map(n => (
                  <div key={n.title} className="p-6 rounded-2xl" style={{ background: "white", border: "1px solid var(--brand-100)", boxShadow: "var(--shadow-sm)" }}>
                    <div className="font-semibold text-[15px] mb-2" style={{ color: "var(--brand-900)", fontFamily: "var(--font-display)" }}>{n.title}</div>
                    <p className="text-[14px] leading-relaxed m-0" style={{ color: "var(--brand-500)" }}>{n.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Use cases */}
          <section className="py-20" style={{ background: "var(--brand-50)" }}>
            <div className="max-w-7xl mx-auto px-6">
              <div className="mb-12">
                <span className="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider mb-3"
                      style={{ color: "var(--accent-strong)", fontFamily: "var(--font-display)" }}>Use cases</span>
                <h2 className="text-[30px] font-bold" style={{ fontFamily: "var(--font-display)", letterSpacing: "-0.02em", color: "var(--brand-900)" }}>Who uses it and why</h2>
              </div>
              <div className="grid md:grid-cols-3 gap-5">
                {useCases.map(c => <Card key={c.title} {...c}/>)}
              </div>
            </div>
          </section>

          {/* Capabilities */}
          <section className="py-20" style={{ background: "white" }}>
            <div className="max-w-7xl mx-auto px-6">
              <div className="mb-12">
                <span className="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider mb-3"
                      style={{ color: "var(--accent-strong)", fontFamily: "var(--font-display)" }}>Capabilities</span>
                <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                  <h2 className="text-[30px] font-bold" style={{ fontFamily: "var(--font-display)", letterSpacing: "-0.02em", color: "var(--brand-900)" }}>What the API gives you today</h2>
                  <p className="text-[15px]" style={{ color: "var(--brand-500)" }}>A narrow but reliable set of endpoints — useful for real integrations, not just demos.</p>
                </div>
              </div>
              <div className="grid md:grid-cols-3 gap-5">
                {capabilities.map(c => <Card key={c.title} {...c}/>)}
              </div>
            </div>
          </section>

          {/* CTA */}
          <section className="py-20 text-center px-6" style={{ background: "var(--bg-cta-dark)" }}>
            <h2 className="text-[36px] font-bold mb-4 text-white"
                style={{ fontFamily: "var(--font-display)", letterSpacing: "-0.02em" }}>
              Read the docs, then run a real request.
            </h2>
            <p className="text-[17px] mb-8 max-w-lg mx-auto" style={{ color: "var(--brand-300)" }}>
              The API contract is small. Most integrations are up and running in under an hour.
            </p>
            <div className="flex flex-col sm:flex-row justify-center gap-3">
              <a href="./docs.html" className="rounded-full px-8 h-12 font-semibold text-[15px] inline-flex items-center justify-center"
                 style={{ background: "white", color: "var(--brand-900)" }}>Read docs</a>
              <a href="./demo.html" className="rounded-full px-8 h-12 font-semibold text-[15px] inline-flex items-center justify-center"
                 style={{ color: "white", border: "1px solid var(--brand-700)" }}>Open demo</a>
            </div>
          </section>

          <Footer/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
