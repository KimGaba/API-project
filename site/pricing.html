<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Company Data API · Pricing</title>
  <link rel="stylesheet" href="./assets/colors_and_type.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; background: white; } * { box-sizing: border-box; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="./assets/components.jsx" data-presets="react"></script>
  <script type="text/babel" data-presets="react">
    const tiers = [
      { name: "Developer", price: "€0", per: "/mo", desc: "Perfect for testing and side projects. No credit card required.", cta: "Start for free", ctaHref: "./signup.html", featured: false,
        perks: ["100 requests / month", "5 requests / minute", "Search + country catalogue", "Norway, Finland, UK"] },
      { name: "Starter", price: "€49", per: "/mo", desc: "For internal tools, pilots, and first live integrations.", cta: "Get started", ctaHref: "./signup.html", featured: true,
        perks: ["10,000 requests / month", "60 requests / minute", "Search + lookup + VAT endpoints", "All live countries", "Email support"] },
      { name: "Growth", price: "€199", per: "/mo", desc: "For enrichment pipelines and operational workflows.", cta: "Contact us", ctaHref: "./signup.html", featured: false,
        perks: ["100,000 requests / month", "300 requests / minute", "Full access + change tracking", "Priority support", "Bulk data access"] },
    ];

    function IcCheck2(p) {
      return (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}>
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      );
    }

    function App() {
      return (
        <>
          <TopNav active="pricing"/>

          {/* Hero */}
          <section className="pt-16 pb-20" style={{ background: "var(--bg-hero)" }}>
            <div className="max-w-7xl mx-auto px-6 text-center">
              <span className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[11px] font-bold uppercase tracking-wider mb-7"
                    style={{ background: "var(--accent-soft)", color: "var(--accent-strong)", border: "1px solid var(--accent-ring)", fontFamily: "var(--font-display)" }}>
                Pricing
              </span>
              <h1 className="font-bold leading-[1.07]"
                  style={{ fontFamily: "var(--font-display)", fontSize: "clamp(36px,5vw,56px)", letterSpacing: "-0.025em", color: "var(--brand-900)" }}>
                Start for free. Scale when ready.
              </h1>
              <p className="mt-5 text-[18px] leading-[1.6] max-w-xl mx-auto" style={{ color: "var(--brand-500)" }}>
                Evaluate the API at no cost. Move to a paid plan when your volume grows.
                No credit card required to get started.
              </p>
              <div className="mt-8 flex flex-wrap justify-center gap-3">
                <PrimaryButton href="./signup.html">Create free account</PrimaryButton>
                <GhostButton href="./demo.html">Try demo first</GhostButton>
              </div>
            </div>
          </section>

          {/* Pricing tiers */}
          <section className="py-20" style={{ background: "var(--brand-50)" }}>
            <div className="max-w-7xl mx-auto px-6">
              <div className="grid md:grid-cols-3 gap-5 max-w-5xl mx-auto">
                {tiers.map(t => (
                  <div key={t.name}
                       className="p-8 bg-white rounded-2xl relative flex flex-col"
                       style={{
                         border: t.featured ? "1px solid var(--accent)" : "1px solid var(--brand-100)",
                         boxShadow: t.featured ? "var(--shadow-lg)" : "var(--shadow-sm)",
                         transform: t.featured ? "scale(1.03)" : "none",
                       }}>
                    {t.featured && (
                      <>
                        <div className="absolute top-0 inset-x-0 h-1 rounded-t-2xl" style={{ background: "var(--accent)" }}/>
                        <span className="inline-block px-3 py-1 text-[11px] font-bold uppercase tracking-wider rounded-full mb-4 w-fit"
                              style={{ background: "var(--accent-soft)", color: "var(--accent)" }}>Most popular</span>
                      </>
                    )}
                    <h3 className="text-[16px] font-semibold mb-1" style={{ fontFamily: "var(--font-display)", color: "var(--brand-900)" }}>{t.name}</h3>
                    <div className="text-[36px] font-bold tracking-tight" style={{ fontFamily: "var(--font-display)", color: "var(--brand-900)" }}>
                      {t.price}<span className="text-[15px] font-normal" style={{ color: "var(--brand-400)" }}>{t.per}</span>
                    </div>
                    <p className="text-[13px] mt-1 mb-6" style={{ color: "var(--brand-500)" }}>{t.desc}</p>
                    <ul className="space-y-3 flex-1 mb-7 text-[14px]" style={{ color: "var(--brand-600)" }}>
                      {t.perks.map(p => (
                        <li key={p} className="flex gap-3 items-center">
                          <IcCheck2 style={{ color: t.featured ? "var(--accent)" : "var(--success)", flexShrink: 0 }}/>
                          {p}
                        </li>
                      ))}
                    </ul>
                    {t.featured
                      ? <PrimaryButton href={t.ctaHref} size="sm">{t.cta}</PrimaryButton>
                      : <GhostButton href={t.ctaHref} size="sm">{t.cta}</GhostButton>}
                  </div>
                ))}
              </div>

              {/* Callout */}
              <div className="max-w-5xl mx-auto mt-8 p-5 rounded-2xl text-[14px]"
                   style={{ background: "rgba(210,153,34,0.07)", border: "1px solid rgba(210,153,34,0.22)", color: "#92400e" }}>
                Exact pricing not yet published. <a href="./signup.html" style={{ color: "var(--accent)", fontWeight: 600 }}>Create an account</a> to be notified when plans launch,
                or <a href="./demo.html" style={{ color: "var(--accent)", fontWeight: 600 }}>try the demo</a> to evaluate the API before committing.
              </div>
            </div>
          </section>

          {/* Enterprise */}
          <section className="py-20" style={{ background: "white" }}>
            <div className="max-w-7xl mx-auto px-6">
              <div className="mb-12 text-center">
                <span className="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider mb-3"
                      style={{ color: "var(--accent-strong)", fontFamily: "var(--font-display)" }}>Enterprise</span>
                <h2 className="text-[30px] font-bold" style={{ fontFamily: "var(--font-display)", letterSpacing: "-0.02em", color: "var(--brand-900)" }}>Need more?</h2>
              </div>
              <div className="grid md:grid-cols-3 gap-5 max-w-4xl mx-auto">
                {[
                  { title: "Custom volume", desc: "Need more than 100,000 requests per month? We offer custom plans with volume discounts and dedicated support." },
                  { title: "SLA and uptime", desc: "Enterprise plans include uptime commitments, priority support, and a dedicated account contact." },
                  { title: "Bulk data access", desc: "For large-scale enrichment, ask about bulk export options and direct database access." },
                ].map(c => (
                  <article key={c.title} className="p-7 rounded-2xl border"
                           style={{ borderColor: "var(--brand-100)", boxShadow: "var(--shadow-sm)" }}>
                    <h3 className="text-[16px] font-semibold mb-2" style={{ fontFamily: "var(--font-display)", color: "var(--brand-900)" }}>{c.title}</h3>
                    <p className="text-[14px] leading-relaxed" style={{ color: "var(--brand-500)" }}>{c.desc}</p>
                  </article>
                ))}
              </div>
            </div>
          </section>

          <Footer/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
