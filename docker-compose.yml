services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_data_dev}
      POSTGRES_USER: ${POSTGRES_USER:-company_data}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-company_data_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-company_data} -d ${POSTGRES_DB:-company_data_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  project-tracker:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro

  dashboard:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace/apps/dashboard
    command: sh -lc "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port ${DASHBOARD_PORT:-3012}"
    ports:
      - "${DASHBOARD_PORT:-3012}:${DASHBOARD_PORT:-3012}"
    volumes:
      - ./:/workspace

  admin:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace/apps/admin
    command: sh -lc "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port ${ADMIN_PORT:-3013}"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://192.168.1.10:3011}
    ports:
      - "${ADMIN_PORT:-3013}:${ADMIN_PORT:-3013}"
    volumes:
      - ./:/workspace

  migrate:
    image: node:22-alpine
    working_dir: /workspace/apps/api
    command: sh -lc "npm install && npm run migrate"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://company_data:company_data_dev@postgres:5432/company_data_dev}
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: node:22-alpine
    working_dir: /workspace/apps/api
    command: sh -lc "npm install && npm run build && npm run start"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://company_data:company_data_dev@postgres:5432/company_data_dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: ${API_PORT:-3011}
      API_KEYS: ${API_KEYS:-demo_live_123}
      HOST: 0.0.0.0
    ports:
      - "${API_PORT:-3011}:3011"
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "3014:8080"
    depends_on:
      - postgres

  worker-no:
    image: python:3.12-slim
    working_dir: /workspace/workers
    command: sh -lc "pip install -r requirements.txt && PYTHONPATH=src python -m company_data_workers.ingest_norway.cli run --limit 2"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://company_data:company_data_dev@postgres:5432/company_data_dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_OUTPUT_DIR: /data/out
    volumes:
      - ./:/workspace
      - raw_artifacts:/data/out
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-fi:
    image: python:3.12-slim
    working_dir: /workspace/workers
    command: sh -lc "pip install -r requirements.txt -e . && PYTHONPATH=src python -m company_data_workers.ingest_finland.cli ingest-bulk"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://company_data:company_data_dev@postgres:5432/company_data_dev}
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  worker-uk:
    image: python:3.12-slim
    working_dir: /workspace/workers
    command: sh -lc "pip install -r requirements.txt && PYTHONPATH=src python -m company_data_workers.ingest_uk.cli run --limit 2"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://company_data:company_data_dev@postgres:5432/company_data_dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_OUTPUT_DIR: /data/out
    volumes:
      - ./:/workspace
      - raw_artifacts:/data/out
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fase 3: UK bulk sync — downloads Companies House BasicCompanyData CSV (~5M companies, no API key needed)
  worker-uk-bulk:
    image: python:3.12-slim
    working_dir: /workspace/workers
    command: sh -lc "pip install -r requirements.txt -e . -q 2>/dev/null && PYTHONPATH=src python -m company_data_workers.ingest_uk.cli ingest-bulk --batch-size 500"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://company_data:company_data_dev@postgres:5432/company_data_dev}
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  # Fase 2: Norway financials — fetches revenue/equity from Regnskapsregisteret for ~430K companies
  worker-no-financials:
    image: python:3.12-slim
    working_dir: /workspace/workers
    command: sh -lc "pip install -r requirements.txt -e . -q 2>/dev/null && PYTHONPATH=src python -m company_data_workers.ingest_norway_financials.cli --batch-size 200"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://company_data:company_data_dev@postgres:5432/company_data_dev}
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  raw_artifacts:
